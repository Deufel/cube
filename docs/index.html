<!DOCTYPE html>
<html id="html" lang="en" data-attr:data-mode="$prst_mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : $prst_mode">
<head id="head">
  <title>CUBE CSS</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.7/bundles/datastar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<div class="vh" data-init="@get('./partials/head.html')"></div>
<body class="fullscreen scroll-no"
  data-persist="{include: /^prst_/}"
  data-signals:prst_theme="'https://cdn.jsdelivr.net/gh/deufel/cube@master/css/2_theme-default.css'"
  data-signals:prst_mode="'system'"
  data-signals:prst_width="'width-md'"
  data-class:width-sm="$prst_width === 'width-sm'"
  data-class:width-md="$prst_width === 'width-md'"
  data-class:width-lg="$prst_width === 'width-lg'">
    
 <div class="grid:hero gap:xs"> 
    <!-- Header with hamburger (mobile) -->
    <div id="header" data-init="@get('./partials/header.html')"></div>
    <div id="nav" data-init="@get('./partials/nav.html')"></div>
    <div id="nav-drawer"></div>
    <main id="readme-content" style="grid-area: 2/2/3/3;" class="scroll-y card flex:stack gap:lg p:lg">
      <p>Loading README...</p>
    </main>
    <script>
      fetch('../README.md')
        .then(res => res.text())
        .then(md => {
          document.getElementById('readme-content').innerHTML = marked.parse(md);
          Prism.highlightAll();
        })
        .catch(err => {
          document.getElementById('readme-content').innerHTML = '<p>Failed to load README.md</p>';
        });
    </script>

    <div id="aside-drawer" data-init="@get('./partials/aside.html')"></div>

    <div id="footer" data-init="@get('./partials/footer.html')"></div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html id="html" lang="en" data-attr:data-mode="$prst_mode === 'system' ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : $prst_mode">
<head id="head">
  <title>CUBE CSS</title>
  <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.7/bundles/datastar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
<body id="body" class="fullscreen scroll-no"
  data-init="@get('./partials/head.html'); @get('./partials/header.html'); @get('./partials/nav.html'); @get('./partials/aside.html'); @get('./partials/footer.html')"
  data-persist="{include: /^prst_/}"
  data-signals:prst_theme="'https://cdn.jsdelivr.net/gh/deufel/cube@master/css/2_theme-default.css'"
  data-signals:prst_mode="'system'"
  data-signals:prst_width="'width-md'"
  data-class:width-sm="$prst_width === 'width-sm'"
  data-class:width-md="$prst_width === 'width-md'"
  data-class:width-lg="$prst_width === 'width-lg'">
    
    <div class="grid:hero gap:xs"> 
      <header id="header" data-init="@get('./partials/header.html')"></header>
      <nav id="nav"></nav>
      <dialog id="nav-drawer"></dialog>

      <main id="main" style="grid-area: 2/2/3/3;" class="scroll-y card flex:stack gap:lg p:lg">
        <p>Loading README...</p>
      </main>

      <script>
        fetch('https://github.com/Deufel/cube/raw/refs/heads/master/README.md')
          .then(res => res.text())
          .then(md => {
            document.getElementById('main').innerHTML = marked.parse(md);
            Prism.highlightAll();
          })
          .catch(err => {
            document.getElementById('main').innerHTML = '<p>Failed to load README.md</p>';
          });
      </script>

      <dialog id="aside-drawer"></dialog>
      <dialog id="footer">      </dialog>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html id="html">
  <head id="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script type="module" src="https://cdn.jsdelivr.net/gh/starfederation/datastar@1.0.0-RC.7/bundles/datastar.js"></script>
  </head>

  <body id="body" bgcolor; class="fullscreen scroll-no" 
    data-init="@get('./partials/head.html'); $prst_theme = 'https://cdn.jsdelivr.net/gh/deufel/cube@master/css/2_theme-default.css'"
    data-persist="{include: /^prst_/}"
    data-signals="{prst_page: {nav_drawer: false, aside_drawer: true, footer_drawer: true }}"
  >
    <div class="grid:hero gap:xs"> 
      <p id="header"  data-init__delay.100ms="@get('./partials/header.html');">
      <p id="nav"     data-init__delay.100ms="@get('./partials/nav.html');">
      <p id="aside"   data-init__delay.100ms="@get('./partials/aside.html');">
      <p id="footer"  data-init__delay.100ms="@get('./partials/footer.html');">
      <p id="main"> 
    </div>
    <datastar-inspector></datastar-inspector>
  </body>

</html>
